name: CI

# One pipeline for every event, with each job running only for the
# events that concern it:
#
#   pull request      the three checks
#   push to main      the three checks, then Vimdoc
#   version tag      the three checks, then the release jobs
#
# The three checks are the Analyzer, the Analyzer on Windows, and the
# Front end.
#
# A tag therefore cannot ship a binary whose suite never ran: the
# builds wait for the checks of the same run. The workflow this
# replaced built and published a tag without running one test.
#
# Each matrix entry names the extension of its executable, because
# only Windows has one.
on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, for a release started by hand.
        required: false
permissions:
  contents: read
# A new push to a pull request replaces a run that has not finished. A
# run that releases is never replaced, because it publishes, and a
# release started by hand runs on a branch ref, so the ref alone
# cannot tell the two apart.
concurrency:
  group: ci-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: >-
    ${{ !startsWith(github.ref, 'refs/tags/')
    && github.event.inputs.tag == '' }}
jobs:
  rust:
    name: Analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Cache the build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust version
        run: cargo --version && rustc --version

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Built for release, because the ceiling is about the analyzer
      # and not about the test profile. The test prints what it
      # measured beside what the Vim9 analyzer took.
      - name: Timing
        run: cargo test --release --test timing -- --nocapture

      - name: Release build
        run: cargo build --release --locked

      # Ghostcode on its own code. Its exports serve its own files
      # alone, and ghostcode.toml says so, along with excluding the
      # fixture corpora, which are other projects' code.
      - name: Run Ghostcode on its own code
        run: |
          set -euo pipefail

          out=$(./target/release/ghostcode --format=text .)

          if [ -n "$out" ]; then
            echo "Ghost code findings:"
            printf '%s\n' "$out"
            printf '%s\n' "$out" | while IFS= read -r line; do
              file=${line%%:*}
              rest=${line#*:}
              lnum=${rest%%:*}
              echo "::error file=$file,line=$lnum::${line#*:*:*:}"
            done
            exit 1
          fi

          echo "No ghost code found."

  # The release matrix builds Windows, and it runs for a tag alone, so
  # nothing would compile that target until the release itself. This
  # job compiles it on a pull request, and runs what can pass there.
  # The parity suite cannot: it compares a report against fixtures
  # whose paths are written with forward slashes, and a Windows report
  # separates with a backslash, which is an open question of its own.
  # REFERENCE: https://github.com/Galvarcus/GhostCode/issues/14
  windows:
    name: Analyzer on Windows
    runs-on: windows-latest
    # The scan below is POSIX shell, which the runner's own PowerShell
    # does not read.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Cache the build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust version
        run: cargo --version && rustc --version

      - name: Tests
        run: cargo test --lib

      - name: Release build
        run: cargo build --release --locked

      # The same scan the Analyzer runs, which is here because it is
      # the one check that walks a real tree and resolves what it
      # finds on this platform.
      - name: Run Ghostcode on its own code
        run: |
          set -euo pipefail

          out=$(./target/release/ghostcode.exe --format=text .)

          if [ -n "$out" ]; then
            echo "Ghost code findings:"
            printf '%s\n' "$out"
            exit 1
          fi

          echo "No ghost code found."

  front-end:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      # The front end speaks through Logger, a shared dependency at
      # github.com/Galvarcus/Logger that is not in this repository.
      - name: Checkout Logger dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: Galvarcus/Logger
          path: deps/Logger

      # The Vim of Ubuntu is the baseline, alongside MacVim on the author's
      # machine. It is behind the floor the guards state, so what it proves
      # is the refusal: the plugin defines nothing and throws nothing on a
      # Vim it does not promise to run on. The floor is read from the guard
      # rather than written here, so a change to the guard carries. The step
      # runs before the AppImage, whose directory reaches $PATH only in the
      # steps after the one that adds it.
      - name: The Vim of Ubuntu, the baseline
        run: |
          set -euo pipefail
          if ! command -v vim > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends vim
          fi
          vim --version | head -1

          floor=$(sed -n 's/.*v:version < \([0-9]\{3\}\).*/\1/p' \
            plugin/ghostcode.vim | head -1)
          if [ -z "$floor" ]; then
            echo "::error::plugin/ghostcode.vim states no v:version floor."
            exit 1
          fi

          rm -f /tmp/baseline.txt
          vim -es -u NONE -N --cmd 'set rtp+=.,deps/Logger' \
            -c 'runtime plugin/ghostcode.vim' \
            -c 'call writefile([v:version, exists(":GhostCode")], "/tmp/baseline.txt")' \
            -c 'quit'

          if [ ! -f /tmp/baseline.txt ]; then
            echo "::error::The baseline Vim exited without writing; it did not reach the end of the probe."
            exit 1
          fi
          ver=$(sed -n 1p /tmp/baseline.txt)
          cmd=$(sed -n 2p /tmp/baseline.txt)
          echo "v:version=$ver floor=$floor :GhostCode=$cmd"

          if [ "$ver" -ge "$floor" ]; then
            echo "::error::Ubuntu now carries Vim $ver, at or above the floor $floor. This step proves the refusal below the floor; run the suite here instead."
            exit 1
          fi
          if [ "$cmd" != 0 ]; then
            echo "::error::The plugin defined :GhostCode on Vim $ver, below the floor $floor."
            exit 1
          fi

      # A prebuilt AppImage of the latest Vim, unpacked, so that Vim is on the
      # PATH. The Vim of the runner is older. With the token, the call to the
      # API has the limit of the repository. Without one it shares a low limit
      # with every other runner.
      - name: Install Vim
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/vim/vim-appimage/releases/latest \
            | jq -r '.assets[] | select(.name | test("^Vim-v.*-x86_64\\.AppImage$")) | .browser_download_url')
          if [ -z "$url" ]; then
            echo "::error::The latest vim-appimage release has no Vim AppImage."
            exit 1
          fi
          curl -fsSL --retry 3 -o /tmp/vim.appimage "$url"
          chmod +x /tmp/vim.appimage
          cd /tmp && ./vim.appimage --appimage-extract > /dev/null
          ln -s /tmp/squashfs-root/AppRun /tmp/squashfs-root/vim
          echo "/tmp/squashfs-root" >> "$GITHUB_PATH"

      - name: Vim version
        run: vim --version

      - name: Run tests
        run: |
          vim -es -u NONE -N -V20/tmp/vim.log \
            --cmd 'set rtp+=.,deps/Logger' \
            -c 'runtime plugin/ghostcode.vim' \
            -c 'source tests/harness.vim' -c 'quit' || true
          if [ ! -f tests/results.txt ]; then
            echo "::error::tests/results.txt was never created - Vim likely failed before finishing. Verbose log follows:"
            cat /tmp/vim.log
            exit 1
          fi
          cat tests/results.txt
          grep -qx 'All tests passed' tests/results.txt

  front-end-windows:
    name: Front end on Windows
    runs-on: windows-latest
    # The steps are POSIX shell, as in the job above, so that one suite is
    # driven the same way on both platforms. Git for Windows provides it.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      # The front end speaks through Logger, a shared dependency at
      # github.com/Galvarcus/Logger that is not in this repository.
      - name: Checkout Logger dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: Galvarcus/Logger
          path: deps/Logger

      # The suite runs a stub in place of the binary, and the front end
      # starts it the way it starts the binary: with the list form of
      # systemlist(), which starts a program directly rather than through a
      # shell. A script cannot stand in for a program there, so the stub is
      # compiled here. The image carries rustc already.
      - name: Build the stub
        run: |
          set -euo pipefail
          rustc --version
          rustc -O tests/stub/ghostcode.rs -o tests/stub/ghostcode.exe
          ./tests/stub/ghostcode.exe --version > /dev/null

      # The portable build of the newest Vim, from the project's own
      # installer repository. Its path is carried in VIM_EXE rather than
      # added to $PATH: that variable prepends to the PATH of Windows,
      # while the shell here is the one Git for Windows ships, which puts
      # its own /usr/bin first and answers `vim` with the MSYS2 build it
      # carries.
      - name: Install Vim
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/vim/vim-win32-installer/releases/latest \
            | jq -r '.assets[] | select(.name | test("^gvim_.*_x64\\.zip$")) | .browser_download_url')
          if [ -z "$url" ]; then
            echo "::error::The latest vim-win32-installer release has no x64 zip."
            exit 1
          fi
          curl -fsSL --retry 3 -o vim.zip "$url"

          # PowerShell unpacks it, because the shell here is the one Git for
          # Windows ships and an unzip of its own is not promised. The path
          # is reached with a glob, which the shell expands itself, rather
          # than with find, whose name Windows also carries.
          powershell -NoProfile -Command \
            "Expand-Archive -Path vim.zip -DestinationPath vim-win32 -Force"
          exe=$(echo vim-win32/vim/vim*/vim.exe)
          if [ ! -f "$exe" ]; then
            echo "::error::The zip holds no vim/vim*/vim.exe; it is laid out differently."
            exit 1
          fi
          echo "VIM_EXE=$(cd "$(dirname "$exe")" && pwd)/vim.exe" >> "$GITHUB_ENV"

      # A Vim that is not a Windows build would run the suite against the
      # script beside the program, and report a pass for a platform it never
      # stood on. The one Git for Windows ships is such a Vim.
      - name: Vim version, and that it is a Windows build
        run: |
          set -euo pipefail
          echo "$VIM_EXE"
          "$VIM_EXE" --version | head -1

          rm -f probe.txt
          "$VIM_EXE" -es -u NONE -N \
            -c 'call writefile([has("win32"), has("win32unix"), v:version], "probe.txt")' \
            -c 'quit'
          if [ ! -f probe.txt ]; then
            echo "::error::Vim wrote no probe; it did not reach the end of the probe."
            exit 1
          fi
          win32=$(sed -n 1p probe.txt)
          unix=$(sed -n 2p probe.txt)
          echo "has('win32')=$win32 has('win32unix')=$unix v:version=$(sed -n 3p probe.txt)"

          if [ "$win32" != 1 ]; then
            echo "::error::This Vim is not a Windows build, so the suite would prove the POSIX path again."
            exit 1
          fi

      # The log is written beside the suite rather than in /tmp: Vim here is
      # a Windows program, which reads /tmp as a directory of the current
      # drive, while the shell reads it as its own temporary directory.
      - name: Run tests
        run: |
          "$VIM_EXE" -es -u NONE -N -V20vim.log \
            --cmd 'set rtp+=.,deps/Logger' \
            -c 'runtime plugin/ghostcode.vim' \
            -c 'source tests/harness.vim' -c 'quit' || true
          if [ ! -f tests/results.txt ]; then
            echo "::error::tests/results.txt was never created - Vim likely failed before finishing. Verbose log follows:"
            cat vim.log
            exit 1
          fi
          cat tests/results.txt
          grep -qx 'All tests passed' tests/results.txt

  # The help file a Vim user reads is generated from the readme, so it
  # is rebuilt on every push to main and committed only when it
  # differs. Deciding first whether a source of it changed cannot be
  # done from a push event alone, and would leave a hand edit of the
  # generated file standing.
  vimdoc:
    name: Vimdoc
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.tag == ''))
    needs:
      - rust
      - front-end
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate Vimdoc
        uses: docker://pandoc/core:latest
        with:
          args: >-
            README.md
            --from=markdown
            --to=vimdoc
            --standalone
            --columns=78
            --toc=true
            --shift-heading-level-by=-1
            --metadata-file=doc/pandoc.yaml
            --lua-filter=doc/vimdoc-filter.lua
            --output=doc/ghostcode.txt

      - name: Commit generated Vimdoc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/ghostcode.txt
          if git diff --cached --quiet; then
            echo "doc/ghostcode.txt is current."
            exit 0
          fi
          git commit -m "docs: regenerate Vimdoc"
          git push origin HEAD:${{ github.ref_name }}

  # SECTION: Everything below releases, and runs for a release tag or
  # for a run started by hand with one. The condition is on this job
  # alone: the jobs after it wait for it, so a skip here skips them
  # too.
  gate:
    name: Tag and version agree
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event.inputs.tag != ''
    needs:
      - rust
      - windows
      - front-end
      - front-end-windows
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # A tag names the version its binaries report and its crate is
      # published under. Nothing else checks that the two agree, and a
      # crate cannot be published twice to correct it. The tag reaches
      # the shell as a variable, because a run started by hand carries
      # whatever was typed into it.
      - name: Compare the tag with the manifest
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # The first package is this crate while the manifest holds
          # one. A workspace would need the name, which lives in
          # src/lib.rs and is not for a workflow to repeat.
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')

          if [ "${TAG#v}" != "$manifest" ]; then
            echo "::error::The tag is $TAG and Cargo.toml says $manifest."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    # The step that names the asset is POSIX shell: a backslash joins
    # its two lines, which PowerShell does not read.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-15-intel
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-15
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The extension stays on the asset, so that Windows runs the
      # file it downloads without being told to rename it.
      - name: Name the asset
        run: |
          cp "target/${{ matrix.target }}/release/ghostcode${{ matrix.ext }}" \
            "ghostcode-${{ matrix.target }}${{ matrix.ext }}"

      - name: Keep the asset for the release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ghostcode-${{ matrix.target }}${{ matrix.ext }}
          path: ghostcode-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Attach the release
    needs:
      - gate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      # The whole history, because the release notes are built from it.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - name: Collect the binaries
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      # Every checksum is written here, by one tool, rather than on the
      # runner that built each binary: a Windows runner has no shasum,
      # and one release attached by one job cannot be left half done
      # when a single target fails.
      - name: Lay out the assets and their checksums
        run: |
          set -euo pipefail

          mkdir -p dist/bin dist/sums
          shopt -s nullglob
          paths=(artifacts/*/*)

          if [ ${#paths[@]} -eq 0 ]; then
            echo "::error::No artifact was downloaded."
            exit 1
          fi

          # Moved one at a time, and never over an asset already
          # there. Today every name is unique, so the check is for the
          # target added later whose asset is named like another's: an
          # asset that is intact, attested and the wrong file is worse
          # than a release that failed.
          for path in "${paths[@]}"; do
            name=$(basename "$path")

            if [ -e "dist/bin/$name" ]; then
              echo "::error::Two artifacts both carry the name $name."
              exit 1
            fi

            mv "$path" "dist/bin/$name"
          done

          for path in dist/bin/*; do
            name=$(basename "$path")
            (cd dist/bin && sha256sum "$name") > "dist/sums/$name.sha256"
          done

          ls -l dist/bin dist/sums

      # The notes are the commit subjects of this tag, which state the
      # problem each commit fixed, with every `fixes:` trailer linked.
      # The asset name is the target triple, so the Linux one carries
      # an `unknown` vendor field that no distribution claims and a
      # `gnu` that names glibc without a version. What decides whether
      # the binary runs is the oldest glibc it can load against, which
      # is a fact about the build rather than about the target. It is
      # read from the asset here, at the only moment every asset of
      # the release is in one place, so the note can never be stale.
      # REFERENCE: https://github.com/Galvarcus/GhostCode/issues/9
      # The notes name an issue by its title, which the script reads with
      # gh. A runner has no token of its own, and without one every line
      # would fall back to the newest commit subject of that issue.
      - name: Write the release notes, with the glibc floor of each asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          notes="$RUNNER_TEMP/notes.md"
          tools/release-notes > "$notes"
          shopt -s nullglob
          paths=(dist/bin/*-linux-gnu)

          if [ ${#paths[@]} -eq 0 ]; then
            echo "::error::No Linux asset was found to measure."
            exit 1
          fi

          printf '\n### Linux compatibility\n\n' >> "$notes"

          # The symbol table is read on its own, so that a failure of
          # `objdump` itself is not reported as an asset that names no
          # version.
          for path in "${paths[@]}"; do
            name=$(basename "$path")
            syms=$(objdump -T "$path")
            need=$(printf '%s\n' "$syms" \
              | grep -o 'GLIBC_[0-9.]*[0-9]' \
              | sort -V | tail -1 || true)

            if [ -z "$need" ]; then
              echo "::error::$name names no glibc symbol version."
              exit 1
            fi

            # The code span is built before the format, because
            # `shellcheck` reads a backtick inside a single-quoted
            # string as a command substitution and warns.
            span="\`$name\`"
            printf -- '- %s needs glibc %s or later.\n' \
              "$span" "${need#GLIBC_}" >> "$notes"
          done

          cat "$notes"

      - name: Attach the assets and the notes
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/bin/*
            dist/sums/*

      # A checksum proves a file is intact. This proves which workflow
      # of which commit built it, so a consumer can verify the origin
      # with `gh attestation verify <file> -R <owner>/<repo>`. It runs
      # after the release is attached, so a failure here leaves a
      # release without provenance rather than without binaries.
      - name: Attest the binaries
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/bin/*

  crate:
    name: Publish the crate
    needs:
      - gate
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: crates.io checks this run's identity
      # against the publisher configured for the crate, which names
      # this workflow file. No registry token is stored anywhere.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
