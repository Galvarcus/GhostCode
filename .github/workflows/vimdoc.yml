name: Generate Vimdoc
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - doc/pandoc.yaml
      - doc/vimdoc-filter.lua
      - .github/workflows/vimdoc.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vimdoc:
    name: Generate Vimdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Vimdoc
        uses: docker://pandoc/core:3.8
        with:
          args: >-
            README.md
            --from=markdown
            --to=vimdoc
            --standalone
            --columns=78
            --toc=true
            --metadata-file=doc/pandoc.yaml
            --lua-filter=doc/vimdoc-filter.lua
            --output=doc/ghostcode.txt

      - name: Commit generated Vimdoc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add doc/tartree.txt
          git commit -m "docs: regenerate Vimdoc"
          git push origin HEAD:${{ github.ref_name }}
